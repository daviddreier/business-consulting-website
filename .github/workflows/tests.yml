name: tests

on:
  pull_request:
  push:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/report.test.mjs
      - run: node tests/quote-form.test.mjs
      - run: node tests/source-scan.test.mjs
